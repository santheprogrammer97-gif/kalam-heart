<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kalam Home Care</title>

<script
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
type="module">
</script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
    radial-gradient(
        circle at 50% 48%,
        #0b5685 0%,
        #073d6c 35%,
        #032b59 72%,
        #021e40 100%
    );

    font-family:Arial,Helvetica,sans-serif;
}


/* ===============================
   MAIN STAGE
================================ */

.heart-stage{

    position:relative;

    width:100vw;
    height:100vh;

    min-height:500px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}


/* ===============================
   CENTER GLOW
================================ */

.glow{

    position:absolute;

    width:430px;
    height:430px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(112,227,223,.38) 0%,
        rgba(112,227,223,.16) 35%,
        transparent 70%
    );

    filter:blur(32px);

    z-index:1;

    pointer-events:none;

    animation:
    glowPulse 1.1s ease-in-out infinite;
}


@keyframes glowPulse{

    0%,100%{
        transform:scale(.94);
        opacity:.65;
    }

    10%{
        transform:scale(1.08);
        opacity:1;
    }

    18%{
        transform:scale(.98);
        opacity:.72;
    }

    30%{
        transform:scale(1.04);
        opacity:.9;
    }

}


/* ===============================
   ORBIT
================================ */

.orbit{

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    border:
    1px solid
    rgba(112,227,223,.20);

    z-index:2;

    pointer-events:none;

    animation:
    orbitRotate 18s linear infinite;
}


.orbit::before{

    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#70e3df;

    box-shadow:
    0 0 10px #70e3df,
    0 0 25px #70e3df;

    top:8px;
    left:50%;
}


.orbit::after{

    content:"";

    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#b9ed42;

    box-shadow:
    0 0 10px #b9ed42,
    0 0 25px #b9ed42;

    right:20px;
    bottom:65px;
}


@keyframes orbitRotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* ===============================
   HEART WRAPPER
================================ */

.heart-wrapper{

    position:relative;

    z-index:5;

    width:430px;
    height:430px;

    display:flex;

    align-items:center;
    justify-content:center;

    animation:
    heartbeat 1.1s ease-in-out infinite;

}


/* ===============================
   3D HEART
================================ */

model-viewer{

    width:430px;
    height:430px;

    display:block;

    background:transparent;

    --poster-color:transparent;

    outline:none;
    border:none;

    filter:
    drop-shadow(
        0 15px 25px rgba(0,0,0,.25)
    )
    drop-shadow(
        0 0 25px rgba(112,227,223,.28)
    );
}


/* ===============================
   HEARTBEAT
================================ */

@keyframes heartbeat{

    0%{
        transform:scale(1);
    }

    8%{
        transform:scale(1.035);
    }

    15%{
        transform:scale(1);
    }

    27%{
        transform:scale(1.018);
    }

    38%{
        transform:scale(1);
    }

    100%{
        transform:scale(1);
    }

}


/* ===============================
   ECG
================================ */

.ecg{

    position:absolute;

    width:min(760px,100vw);

    height:100px;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    z-index:8;

    pointer-events:none;

    opacity:.62;
}


.ecg svg{

    width:100%;
    height:100%;

    display:block;
}


.ecg path{

    fill:none;

    stroke:#b9ed42;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:1000;

    stroke-dashoffset:1000;

    filter:
    drop-shadow(
        0 0 7px
        rgba(185,237,66,.85)
    );

    animation:
    ecgMove 2.6s linear infinite;
}


@keyframes ecgMove{

    to{
        stroke-dashoffset:0;
    }

}


/* ===============================
   LABEL
================================ */

.label{

    position:absolute;

    left:50%;
    bottom:22px;

    transform:translateX(-50%);

    z-index:20;

    color:
    rgba(255,255,255,.42);

    font-size:10px;

    letter-spacing:3px;

    white-space:nowrap;
}


/* ===============================
   DESKTOP
================================ */

@media(min-width:1000px){

    .heart-wrapper,
    model-viewer{

        width:430px;
        height:430px;

    }

}


/* ===============================
   TABLET
================================ */

@media(max-width:800px){

    .heart-wrapper,
    model-viewer{

        width:370px;
        height:370px;

    }

    .orbit{

        width:430px;
        height:430px;

    }

    .glow{

        width:350px;
        height:350px;

    }

    .ecg{

        width:620px;

    }

}


/* ===============================
   MOBILE
================================ */

@media(max-width:500px){

    .heart-wrapper,
    model-viewer{

        width:310px;
        height:310px;

    }

    .orbit{

        width:350px;
        height:350px;

    }

    .glow{

        width:280px;
        height:280px;

    }

    .ecg{

        width:520px;

        opacity:.45;

    }

}


/* ===============================
   SMALL MOBILE
================================ */

@media(max-width:380px){

    .heart-wrapper,
    model-viewer{

        width:275px;
        height:275px;

    }

    .orbit{

        width:310px;
        height:310px;

    }

    .ecg{

        width:450px;

    }

}

</style>

</head>


<body>


<div class="heart-stage">


    <!-- GLOW -->

    <div class="glow"></div>


    <!-- ORBIT -->

    <div class="orbit"></div>


    <!-- ECG -->

    <div class="ecg">

        <svg
        viewBox="0 0 900 120"
        preserveAspectRatio="none">

            <path d="
            M0 60
            L150 60
            L175 60
            L190 55
            L205 60
            L250 60
            L270 60
            L285 18
            L300 100
            L315 60
            L370 60
            L395 60
            L415 42
            L430 60
            L900 60
            "/>

        </svg>

    </div>


    <!-- HEART -->

    <div class="heart-wrapper">

        <model-viewer

        id="heart"

        src="./Kalam_Glass_Heart.glb"

        alt="Kalam Home Care 3D Glass Heart"

        camera-controls

        auto-rotate

        auto-rotate-delay="0"

        rotation-per-second="7deg"

        interaction-prompt="none"

        disable-zoom

        shadow-intensity="1.2"

        shadow-softness=".8"

        exposure="1.05"

        environment-image="neutral"

        camera-orbit="0deg 75deg 10m"

        field-of-view="38deg">

        </model-viewer>

    </div>


    <div class="label">

        KALAM HOME CARE

    </div>


</div>


<script>


const heart =
document.getElementById("heart");


/* ===============================
   MOUSE 3D TILT
================================ */

document.addEventListener(
    "mousemove",
    function(event){

        const x =
        (event.clientX /
        window.innerWidth) - 0.5;

        const y =
        (event.clientY /
        window.innerHeight) - 0.5;


        heart.style.transform =
        "rotateX(" +
        (-y * 4) +
        "deg) rotateY(" +
        (x * 6) +
        "deg)";

    }
);


/* ===============================
   RESET
================================ */

document.addEventListener(
    "mouseleave",
    function(){

        heart.style.transform =
        "rotateX(0deg) rotateY(0deg)";

    }
);

</script>


</body>

</html>
