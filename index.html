<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kalam Glass Heart</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#032b59;
}

canvas{
    display:block;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-family:Arial,sans-serif;
    font-size:14px;
    letter-spacing:1px;
}

</style>

</head>

<body>

<div id="loading">
    Loading 3D Heart...
</div>


<script type="importmap">

{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}

</script>


<script type="module">

import * as THREE from "three";

import { GLTFLoader }
from "three/addons/loaders/GLTFLoader.js";

import { RoomEnvironment }
from "three/addons/environments/RoomEnvironment.js";



/* =========================================
   SCENE
========================================= */

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0x032b59);



/* =========================================
   CAMERA
========================================= */

const camera =
new THREE.PerspectiveCamera(
    32,
    window.innerWidth /
    window.innerHeight,
    0.1,
    100
);

camera.position.set(
    0,
    0,
    4
);



/* =========================================
   RENDERER
========================================= */

const renderer =
new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
1.25;

renderer.transmissionResolutionScale =
window.devicePixelRatio;

document.body.appendChild(
    renderer.domElement
);



/* =========================================
   REALISTIC LIGHTING
========================================= */

const pmrem =
new THREE.PMREMGenerator(
    renderer
);

scene.environment =
pmrem.fromScene(
    new RoomEnvironment(),
    0.04
).texture;



/* =========================================
   LIGHTS
========================================= */

const keyLight =
new THREE.DirectionalLight(
    0xffffff,
    3
);

keyLight.position.set(
    3,
    4,
    5
);

scene.add(keyLight);


const blueLight =
new THREE.PointLight(
    0x65e7ff,
    8,
    8
);

blueLight.position.set(
    -2,
    1,
    2
);

scene.add(blueLight);


const cyanLight =
new THREE.PointLight(
    0x70e3df,
    6,
    7
);

cyanLight.position.set(
    2,
    -2,
    1
);

scene.add(cyanLight);



/* =========================================
   HEART GROUP
========================================= */

const heartGroup =
new THREE.Group();

scene.add(
    heartGroup
);



/* =========================================
   LOAD GLB
========================================= */

const loader =
new GLTFLoader();


loader.load(

    "./New_Project_8242026.glb",

    function(gltf){

        const heart =
        gltf.scene;


        heartGroup.add(
            heart
        );


        /* -------------------------------
           CENTER + SCALE MODEL
        -------------------------------- */

        const box =
        new THREE.Box3()
        .setFromObject(
            heart
        );


        const center =
        box.getCenter(
            new THREE.Vector3()
        );


        heart.position.sub(
            center
        );


        const size =
        box.getSize(
            new THREE.Vector3()
        );


        const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


        const scale =
        2.65 / maxSize;


        heart.scale.setScalar(
            scale
        );


        /* -------------------------------
           GLASS MATERIAL
        -------------------------------- */

        heart.traverse(
            function(object){

                if(
                    object.isMesh
                ){

                    object.castShadow =
                    true;

                    object.receiveShadow =
                    true;


                    object.material =
                    new THREE.MeshPhysicalMaterial({

                        color:
                        new THREE.Color(
                            0x8eeef0
                        ),

                        transparent:
                        true,

                        opacity:
                        0.58,

                        roughness:
                        0.08,

                        metalness:
                        0.05,

                        transmission:
                        1.0,

                        thickness:
                        0.65,

                        ior:
                        1.45,

                        clearcoat:
                        1.0,

                        clearcoatRoughness:
                        0.05,

                        attenuationColor:
                        new THREE.Color(
                            0x4fdde0
                        ),

                        attenuationDistance:
                        2.5

                    });

                }

            }
        );


        document
        .getElementById(
            "loading"
        )
        .style.display =
        "none";

    },

    undefined,

    function(error){

        console.error(
            error
        );

        document
        .getElementById(
            "loading"
        )
        .innerHTML =
        "Heart loading error";

    }

);



/* =========================================
   MOUSE
========================================= */

let mouseX = 0;
let mouseY = 0;

let targetX = 0;
let targetY = 0;


document.addEventListener(
    "mousemove",
    function(event){

        mouseX =
        (event.clientX /
        window.innerWidth -
        0.5);

        mouseY =
        (event.clientY /
        window.innerHeight -
        0.5);

    }
);



/* =========================================
   ANIMATION
========================================= */

const clock =
new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
    clock.getElapsedTime();


    /* -------------------------------
       HEART ROTATION
    -------------------------------- */

    heartGroup.rotation.y +=
    0.004;


    targetX =
    mouseY * -0.22;

    targetY =
    mouseX * 0.28;


    heartGroup.rotation.x +=
    (targetX -
    heartGroup.rotation.x)
    * 0.035;


    heartGroup.rotation.z +=
    (targetY -
    heartGroup.rotation.z)
    * 0.035;


    /* -------------------------------
       HEARTBEAT
    -------------------------------- */

    const beat =
    1 +
    Math.pow(
        Math.max(
            0,
            Math.sin(
                time * 6
            )
        ),
        18
    ) * 0.055;


    heartGroup.scale.setScalar(
        beat
    );


    /* -------------------------------
       FLOATING
    -------------------------------- */

    heartGroup.position.y =
    Math.sin(
        time * 1.2
    ) * 0.045;


    /* -------------------------------
       LIGHT MOVEMENT
    -------------------------------- */

    blueLight.position.x =
    Math.sin(
        time * 0.7
    ) * 3;


    blueLight.position.z =
    Math.cos(
        time * 0.7
    ) * 3;


    renderer.render(
        scene,
        camera
    );

}


animate();



/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>

</html>
