<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalam Home Care</title>

<script
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
type="module">
</script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
    radial-gradient(
        circle at center,
        #2149a5 0%,
        #163b86 42%,
        #0d2b67 72%,
        #071d4d 100%
    );
    font-family:Arial,Helvetica,sans-serif;
}

.heart-page{
    position:relative;
    width:100vw;
    height:100vh;
    min-height:450px;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* GLOW */

.glow{
    position:absolute;

    width:430px;
    height:430px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(100,145,255,.28),
        rgba(80,120,230,.10) 45%,
        transparent 72%
    );

    filter:blur(32px);

    z-index:1;

    animation:glow 1.1s ease-in-out infinite;
}

@keyframes glow{

    0%,100%{
        transform:translate(-50%,-50%) scale(.95);
        opacity:.7;
    }

    10%{
        transform:translate(-50%,-50%) scale(1.08);
        opacity:1;
    }

    20%{
        transform:translate(-50%,-50%) scale(.98);
    }

    35%{
        transform:translate(-50%,-50%) scale(1.04);
    }
}


/* ORBIT */

.orbit{
    position:absolute;

    width:520px;
    height:520px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:1px solid rgba(160,190,255,.20);

    border-radius:50%;

    z-index:2;

    animation:orbit 22s linear infinite;
}

.orbit:before{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#91aeff;

    box-shadow:
    0 0 10px #91aeff,
    0 0 25px #91aeff;

    top:5px;
    left:50%;
}

.orbit:after{
    content:"";

    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#fff;

    box-shadow:
    0 0 12px #fff,
    0 0 25px rgba(255,255,255,.7);

    right:18px;
    bottom:65px;
}

@keyframes orbit{

    from{
        transform:translate(-50%,-50%) rotate(0deg);
    }

    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}


/* HEART */

.heart-container{

    position:relative;

    z-index:5;

    width:520px;
    height:620px;

    display:flex;

    align-items:center;
    justify-content:center;

    animation:beat 1.1s ease-in-out infinite;
}

@keyframes beat{

    0%,100%{
        transform:scale(1);
    }

    8%{
        transform:scale(1.025);
    }

    15%{
        transform:scale(1);
    }

    27%{
        transform:scale(1.015);
    }

    38%{
        transform:scale(1);
    }
}


/*
   IMPORTANT:
   NO FIXED CAMERA ORBIT.
   MODEL-VIEWER WILL AUTO FRAME THE GLB.
*/

model-viewer{

    width:520px;
    height:620px;

    background:transparent;

    --poster-color:transparent;

    border:0;
    outline:0;

    display:block;

    pointer-events:none;

    /* THIS MAKES THE GLB SMALLER */

    --model-viewer-width:100%;
    --model-viewer-height:100%;

    filter:
    drop-shadow(
        0 18px 30px rgba(0,0,0,.22)
    );
}


/* ECG */

.ecg{

    position:absolute;

    width:min(900px,100vw);

    height:100px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:10;

    pointer-events:none;

    opacity:.62;
}

.ecg svg{
    width:100%;
    height:100%;
}

.ecg path{

    fill:none;

    stroke:#8aa8ff;

    stroke-width:2.4;

    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:1000;
    stroke-dashoffset:1000;

    filter:
    drop-shadow(
        0 0 7px rgba(130,165,255,.9)
    );

    animation:
    ecgMove
    2.6s
    linear
    infinite;
}

@keyframes ecgMove{

    to{
        stroke-dashoffset:0;
    }
}


/* BRAND */

.brand{

    position:absolute;

    bottom:15px;
    left:50%;

    transform:translateX(-50%);

    color:rgba(255,255,255,.25);

    font-size:9px;

    font-weight:bold;

    letter-spacing:3px;

    z-index:20;

    white-space:nowrap;
}


/* TABLET */

@media(max-width:900px){

    .orbit{
        width:450px;
        height:450px;
    }

    .glow{
        width:370px;
        height:370px;
    }

    .heart-container{
        width:430px;
        height:520px;
    }

    model-viewer{
        width:430px;
        height:520px;
    }
}


/* MOBILE */

@media(max-width:500px){

    .orbit{
        width:340px;
        height:340px;
    }

    .glow{
        width:280px;
        height:280px;
    }

    .heart-container{
        width:330px;
        height:420px;
    }

    model-viewer{
        width:330px;
        height:420px;
    }

    .ecg{
        width:600px;
        opacity:.5;
    }
}

</style>
</head>


<body>

<div class="heart-page">

    <div class="glow"></div>

    <div class="orbit"></div>


    <!-- SINGLE ECG -->

    <div class="ecg">

        <svg
        viewBox="0 0 900 120"
        preserveAspectRatio="none">

            <path d="
                M0 60
                L145 60
                L170 60
                L188 54
                L205 60
                L255 60
                L275 60
                L292 18
                L307 101
                L322 60
                L375 60
                L400 60
                L420 42
                L438 60
                L900 60
            "/>

        </svg>

    </div>


    <!-- 3D HEART -->

    <div class="heart-container">

        <model-viewer

            src="./New_Project_8242026.glb"

            alt="Kalam Home Care 3D Heart"

            auto-rotate

            auto-rotate-delay="0"

            rotation-per-second="5deg"

            interaction-prompt="none"

            disable-zoom

            shadow-intensity="0.6"

            shadow-softness="1"

            exposure="0.65"

            environment-image="neutral"

            field-of-view="45deg"

            camera-controls="false">

        </model-viewer>

    </div>


    <div class="brand">
        KALAM HOME CARE
    </div>

</div>

</body>
</html>
