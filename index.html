<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalam Home Care</title>

<script
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
type="module">
</script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    background:
    radial-gradient(
        circle at 50% 50%,
        #2149a5 0%,
        #173d8d 40%,
        #0d2b67 72%,
        #071d4d 100%
    );

    font-family:Arial,Helvetica,sans-serif;
}


/* =========================
   MAIN
========================= */

.heart-page{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

}


/* =========================
   GLOW
========================= */

.glow{

    position:absolute;

    width:420px;
    height:420px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(100,145,255,.25),
        rgba(70,110,230,.08) 45%,
        transparent 72%
    );

    filter:blur(35px);

    z-index:1;

    animation:glowPulse 1.1s ease-in-out infinite;

}

@keyframes glowPulse{

    0%,100%{
        transform:translate(-50%,-50%) scale(.95);
        opacity:.65;
    }

    10%{
        transform:translate(-50%,-50%) scale(1.07);
        opacity:1;
    }

    20%{
        transform:translate(-50%,-50%) scale(.98);
    }

    35%{
        transform:translate(-50%,-50%) scale(1.03);
    }

}


/* =========================
   ORBIT
========================= */

.orbit{

    position:absolute;

    width:540px;
    height:540px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:
    1px solid
    rgba(160,190,255,.20);

    border-radius:50%;

    z-index:2;

    animation:orbitRotate 22s linear infinite;

}

.orbit::before{

    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#91aeff;

    box-shadow:
    0 0 10px #91aeff,
    0 0 25px #91aeff;

    top:5px;
    left:50%;

}

.orbit::after{

    content:"";

    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#fff;

    box-shadow:
    0 0 12px #fff,
    0 0 25px rgba(255,255,255,.7);

    right:18px;
    bottom:65px;

}

@keyframes orbitRotate{

    from{
        transform:translate(-50%,-50%) rotate(0deg);
    }

    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }

}


/* =========================
   HEART
========================= */

.heart-container{

    position:relative;

    z-index:5;

    width:600px;
    height:700px;

    display:flex;

    align-items:center;
    justify-content:center;

    animation:heartbeat 1.1s ease-in-out infinite;

}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    8%{
        transform:scale(1.025);
    }

    15%{
        transform:scale(1);
    }

    27%{
        transform:scale(1.015);
    }

    38%{
        transform:scale(1);
    }

}


/* =========================
   3D MODEL
========================= */

model-viewer{

    width:600px;
    height:700px;

    display:block;

    background:transparent;

    --poster-color:transparent;

    border:0;
    outline:0;

    pointer-events:none;

    filter:
    drop-shadow(
        0 20px 30px
        rgba(0,0,0,.22)
    );

}


/* =========================
   ECG
========================= */

.ecg{

    position:absolute;

    width:min(900px,100vw);

    height:100px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:10;

    pointer-events:none;

    opacity:.62;

}

.ecg svg{

    width:100%;
    height:100%;

}

.ecg path{

    fill:none;

    stroke:#8aa8ff;

    stroke-width:2.4;

    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:1000;

    stroke-dashoffset:1000;

    filter:
    drop-shadow(
        0 0 7px
        rgba(130,165,255,.9)
    );

    animation:
    ecgMove
    2.6s
    linear
    infinite;

}

@keyframes ecgMove{

    to{
        stroke-dashoffset:0;
    }

}


/* =========================
   BRAND
========================= */

.brand{

    position:absolute;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    color:rgba(255,255,255,.25);

    font-size:9px;

    font-weight:bold;

    letter-spacing:3px;

    z-index:20;

}


/* =========================
   DESKTOP
========================= */

@media(min-width:901px){

    model-viewer{

        width:600px;
        height:700px;

        /*
        IMPORTANT CAMERA FIX
        */

        --camera-orbit:0deg 80deg 70m;

    }

}


/* =========================
   TABLET
========================= */

@media(max-width:900px){

    .orbit{

        width:460px;
        height:460px;

    }

    .glow{

        width:360px;
        height:360px;

    }

    .heart-container{

        width:500px;
        height:600px;

    }

    model-viewer{

        width:500px;
        height:600px;

        --camera-orbit:0deg 80deg 65m;

    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .orbit{

        width:340px;
        height:340px;

    }

    .glow{

        width:280px;
        height:280px;

    }

    .heart-container{

        width:350px;
        height:450px;

    }

    model-viewer{

        width:350px;
        height:450px;

        --camera-orbit:0deg 80deg 60m;

    }

    .ecg{

        width:600px;

        opacity:.5;

    }

}

</style>

</head>


<body>

<div class="heart-page">


    <div class="glow"></div>


    <div class="orbit"></div>


    <!-- SINGLE ECG -->

    <div class="ecg">

        <svg
        viewBox="0 0 900 120"
        preserveAspectRatio="none">

            <path d="
                M0 60
                L145 60
                L170 60
                L188 54
                L205 60
                L255 60
                L275 60
                L292 18
                L307 101
                L322 60
                L375 60
                L400 60
                L420 42
                L438 60
                L900 60
            "/>

        </svg>

    </div>


    <!-- HEART -->

    <div class="heart-container">

        <model-viewer

            src="./New_Project_8242026.glb"

            alt="Kalam Home Care 3D Heart"

            auto-rotate

            auto-rotate-delay="0"

            rotation-per-second="5deg"

            interaction-prompt="none"

            disable-zoom

            shadow-intensity="0.55"

            shadow-softness="1"

            exposure="0.55"

            environment-image="neutral"

            camera-orbit="0deg 80deg 70m"

            camera-target="0m 0m 0m"

            field-of-view="50deg">

        </model-viewer>

    </div>


    <div class="brand">
        KALAM HOME CARE
    </div>


</div>

</body>

</html>
