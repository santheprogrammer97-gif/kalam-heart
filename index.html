<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kalam Glass Heart</title>

<script
  type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 45%,
            #0a4c82 0%,
            #073866 40%,
            #032b59 75%,
            #021e40 100%
        );

    display:flex;
    align-items:center;
    justify-content:center;
}


/* HEART CONTAINER */

.heart-stage{

    width:100vw;
    height:100vh;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}


/* GLOW */

.glow{

    position:absolute;

    width:520px;
    height:520px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(112,227,223,.42),
            rgba(112,227,223,.16) 35%,
            transparent 70%
        );

    filter:blur(30px);

    animation:
        glowPulse 1.15s ease-in-out infinite;

    pointer-events:none;
}


@keyframes glowPulse{

    0%,100%{
        transform:scale(.95);
        opacity:.65;
    }

    12%{
        transform:scale(1.12);
        opacity:1;
    }

    25%{
        transform:scale(.98);
        opacity:.72;
    }

    40%{
        transform:scale(1.07);
        opacity:.9;
    }

}


/* ORBIT */

.orbit{

    position:absolute;

    width:600px;
    height:600px;

    border:1px solid rgba(112,227,223,.18);

    border-radius:50%;

    animation:
        orbitRotate 16s linear infinite;

    pointer-events:none;
}


.orbit::after{

    content:"";

    position:absolute;

    width:9px;
    height:9px;

    border-radius:50%;

    background:#b9ed42;

    box-shadow:
        0 0 10px #b9ed42,
        0 0 30px #70e3df;

    top:8px;
    left:50%;

}


@keyframes orbitRotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* HEART */

model-viewer{

    width:600px;
    height:600px;

    position:relative;

    z-index:5;

    background:transparent;

    --poster-color:transparent;

    outline:none;

    animation:
        heartbeat 1.1s ease-in-out infinite;
}


/* HEARTBEAT */

@keyframes heartbeat{

    0%{
        transform:scale(1);
    }

    8%{
        transform:scale(1.045);
    }

    16%{
        transform:scale(1);
    }

    28%{
        transform:scale(1.025);
    }

    38%{
        transform:scale(1);
    }

    100%{
        transform:scale(1);
    }

}


/* ECG */

.ecg{

    position:absolute;

    width:900px;
    height:120px;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:8;

    pointer-events:none;

    opacity:.55;

}


.ecg svg{

    width:100%;
    height:100%;

}


.ecg path{

    fill:none;

    stroke:#b9ed42;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;

    stroke-dasharray:1000;

    stroke-dashoffset:1000;

    animation:
        ecgMove 2.6s linear infinite;

    filter:
        drop-shadow(
            0 0 7px rgba(185,237,66,.8)
        );

}


@keyframes ecgMove{

    to{
        stroke-dashoffset:0;
    }

}


/* SMALL LABEL */

.label{

    position:absolute;

    bottom:35px;

    left:50%;

    transform:translateX(-50%);

    z-index:10;

    color:rgba(255,255,255,.5);

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:3px;

}


/* MOBILE */

@media(max-width:700px){

    model-viewer{

        width:430px;
        height:430px;

    }

    .orbit{

        width:420px;
        height:420px;

    }

    .glow{

        width:360px;
        height:360px;

    }

    .ecg{

        width:650px;

    }

}


</style>

</head>


<body>


<div class="heart-stage">


    <!-- GLOW -->

    <div class="glow"></div>


    <!-- ORBIT -->

    <div class="orbit"></div>


    <!-- ECG -->

    <div class="ecg">

        <svg
            viewBox="0 0 900 120"
            preserveAspectRatio="none">

            <path d="
                M0 60
                L150 60

                L175 60
                L190 55
                L205 60

                L250 60

                L270 60
                L285 18
                L300 100
                L315 60

                L370 60

                L395 60
                L415 42
                L430 60

                L900 60
            "/>

        </svg>

    </div>


    <!-- ACTUAL GLASS GLB -->

    <model-viewer

        id="heart"

        src="./Kalam_Glass_Heart.glb"

        alt="Kalam Home Care Glass Heart"

        camera-controls

        auto-rotate

        auto-rotate-delay="0"

        rotation-per-second="12deg"

        interaction-prompt="none"

        disable-zoom

        shadow-intensity="1.5"

        shadow-softness="0.7"

        exposure="1.15"

        environment-image="neutral"

        camera-orbit="0deg 75deg 3m"

        field-of-view="32deg">

    </model-viewer>


    <div class="label">

        KALAM HOME CARE

    </div>


</div>


<script>

const heart =
document.getElementById("heart");


/* MOUSE TILT */

document.addEventListener(
    "mousemove",
    function(event){

        const x =
            (event.clientX /
            window.innerWidth - .5);

        const y =
            (event.clientY /
            window.innerHeight - .5);


        heart.style.transform =
            "rotateX(" +
            (-y * 5) +
            "deg) rotateY(" +
            (x * 7) +
            "deg)";

    }
);


/* RESET */

document.addEventListener(
    "mouseleave",
    function(){

        heart.style.transform =
            "rotateX(0deg) rotateY(0deg)";

    }
);

</script>


</body>

</html>
