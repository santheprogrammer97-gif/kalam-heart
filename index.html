<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalam Home Care</title>

<script
  type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 50%,
            #244fa8 0%,
            #183f8d 42%,
            #0d2c69 72%,
            #071d4d 100%
        );

    font-family:Arial, Helvetica, sans-serif;
}

.hero{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================
   BACKGROUND GLOW
========================= */

.glow{
    position:absolute;

    width:480px;
    height:480px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(100,160,255,.30),
            rgba(70,120,235,.12) 45%,
            transparent 72%
        );

    filter:blur(35px);

    z-index:1;

    animation:glowPulse 1.1s ease-in-out infinite;
}

@keyframes glowPulse{

    0%,100%{
        transform:translate(-50%,-50%) scale(.96);
        opacity:.7;
    }

    10%{
        transform:translate(-50%,-50%) scale(1.07);
        opacity:1;
    }

    20%{
        transform:translate(-50%,-50%) scale(.98);
    }

    35%{
        transform:translate(-50%,-50%) scale(1.04);
    }
}


/* =========================
   CIRCLE
========================= */

.orbit{
    position:absolute;

    width:550px;
    height:550px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:1px solid rgba(150,190,255,.22);

    border-radius:50%;

    z-index:2;

    pointer-events:none;

    animation:orbitRotate 24s linear infinite;
}

.orbit::before{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    left:50%;
    top:5px;

    border-radius:50%;

    background:#9bb5ff;

    box-shadow:
        0 0 10px #9bb5ff,
        0 0 25px #9bb5ff;
}

.orbit::after{
    content:"";

    position:absolute;

    width:8px;
    height:8px;

    right:18px;
    bottom:65px;

    border-radius:50%;

    background:#ffffff;

    box-shadow:
        0 0 12px #ffffff,
        0 0 25px rgba(255,255,255,.7);
}

@keyframes orbitRotate{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}


/* =========================
   HEART AREA
========================= */

.heart-area{
    position:relative;

    z-index:5;

    width:520px;
    height:620px;

    display:flex;
    align-items:center;
    justify-content:center;

    animation:heartbeat 1.1s ease-in-out infinite;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    8%{
        transform:scale(1.025);
    }

    15%{
        transform:scale(1);
    }

    27%{
        transform:scale(1.015);
    }

    38%{
        transform:scale(1);
    }
}


/* =========================
   ORIGINAL GLASS GLB
========================= */

model-viewer{

    width:520px;
    height:620px;

    display:block;

    background:transparent;

    --poster-color:transparent;

    border:0;
    outline:0;

    /*
       IMPORTANT:
       Original GLB material untouched.
       Original glass texture untouched.
    */

}


/* =========================
   ECG
========================= */

.ecg{
    position:absolute;

    width:min(900px,100vw);
    height:100px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:10;

    pointer-events:none;

    opacity:.65;
}

.ecg svg{
    width:100%;
    height:100%;
}

.ecg path{

    fill:none;

    stroke:#9ab5ff;

    stroke-width:2.3;

    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:1000;
    stroke-dashoffset:1000;

    filter:
        drop-shadow(
            0 0 7px
            rgba(130,170,255,.9)
        );

    animation:
        ecgMove
        2.6s
        linear
        infinite;
}

@keyframes ecgMove{

    to{
        stroke-dashoffset:0;
    }
}


/* =========================
   BRAND
========================= */

.brand{

    position:absolute;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    color:rgba(255,255,255,.25);

    font-size:9px;

    font-weight:700;

    letter-spacing:3px;

    z-index:20;

    white-space:nowrap;
}


/* =========================
   TABLET
========================= */

@media(max-width:900px){

    .heart-area{
        width:430px;
        height:520px;
    }

    model-viewer{
        width:430px;
        height:520px;
    }

    .orbit{
        width:460px;
        height:460px;
    }

    .glow{
        width:380px;
        height:380px;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .heart-area{
        width:330px;
        height:420px;
    }

    model-viewer{
        width:330px;
        height:420px;
    }

    .orbit{
        width:350px;
        height:350px;
    }

    .glow{
        width:290px;
        height:290px;
    }

    .ecg{
        width:580px;
        opacity:.55;
    }
}

</style>
</head>


<body>

<div class="hero">

    <!-- Background glow -->
    <div class="glow"></div>

    <!-- Orbit -->
    <div class="orbit"></div>


    <!-- ONE ECG LINE -->

    <div class="ecg">

        <svg
            viewBox="0 0 900 120"
            preserveAspectRatio="none">

            <path d="
                M0 60
                L145 60
                L170 60
                L188 54
                L205 60
                L255 60
                L275 60
                L292 18
                L307 101
                L322 60
                L375 60
                L400 60
                L420 42
                L438 60
                L900 60
            "/>

        </svg>

    </div>


    <!-- KALAM GLASS HEART -->

    <div class="heart-area">

        <model-viewer

            src="./Kalam_Glass_Heart.glb"

            alt="Kalam Home Care Glass Heart"

            auto-rotate

            auto-rotate-delay="0"

            rotation-per-second="5deg"

            camera-controls

            interaction-prompt="auto"

            shadow-intensity="1"

            shadow-softness="0.8"

            exposure="1"

            environment-image="neutral">

        </model-viewer>

    </div>


    <div class="brand">
        KALAM HOME CARE
    </div>

</div>

</body>

</html>
