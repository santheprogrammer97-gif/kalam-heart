<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kalam Home Care Heart</title>

<script
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
type="module">
</script>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    overflow:hidden;

}


body{

    background:
    radial-gradient(
        circle at 50% 48%,
        #173F9E 0%,
        #103680 38%,
        #09265E 72%,
        #061B48 100%
    );

    font-family:
    Arial,
    Helvetica,
    sans-serif;

}


/* =====================================================
   MAIN
===================================================== */

.heart-page{

    width:100vw;
    height:100vh;

    min-height:500px;

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

}


/* =====================================================
   CENTER GLOW
===================================================== */

.glow{

    position:absolute;

    width:460px;
    height:460px;

    border-radius:50%;

    background:

    radial-gradient(
        circle,
        rgba(120,160,255,.32) 0%,
        rgba(80,120,230,.16) 38%,
        transparent 72%
    );

    filter:blur(35px);

    pointer-events:none;

    z-index:1;

    animation:

    glowPulse
    1.1s
    ease-in-out
    infinite;

}


@keyframes glowPulse{

    0%,100%{

        transform:scale(.94);

        opacity:.65;

    }

    10%{

        transform:scale(1.08);

        opacity:1;

    }

    20%{

        transform:scale(.98);

        opacity:.72;

    }

    35%{

        transform:scale(1.04);

        opacity:.9;

    }

}


/* =====================================================
   ORBIT
===================================================== */

.orbit{

    position:absolute;

    width:520px;
    height:520px;

    border-radius:50%;

    border:

    1px solid
    rgba(150,180,255,.22);

    z-index:2;

    pointer-events:none;

    animation:

    orbitRotate
    20s
    linear
    infinite;

}


.orbit::before{

    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#8CA9FF;

    box-shadow:

    0 0 10px #8CA9FF,
    0 0 25px #8CA9FF;

    top:7px;

    left:50%;

}


.orbit::after{

    content:"";

    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#ffffff;

    box-shadow:

    0 0 12px #ffffff,
    0 0 25px rgba(255,255,255,.7);

    right:18px;

    bottom:65px;

}


@keyframes orbitRotate{

    from{

        transform:
        rotate(0deg);

    }

    to{

        transform:
        rotate(360deg);

    }

}


/* =====================================================
   HEART CONTAINER
===================================================== */

.heart-container{

    position:relative;

    z-index:5;

    width:500px;
    height:540px;

    display:flex;

    align-items:center;

    justify-content:center;

    animation:

    heartBeat
    1.1s
    ease-in-out
    infinite;

}


/* =====================================================
   3D HEART
===================================================== */

model-viewer{

    width:500px;
    height:540px;

    display:block;

    background:transparent;

    --poster-color:transparent;

    outline:none;

    border:none;

    pointer-events:none;

    filter:

    drop-shadow(
        0 20px 30px
        rgba(0,0,0,.25)
    )

    drop-shadow(
        0 0 25px
        rgba(100,150,255,.22)
    );

}


/* =====================================================
   HEARTBEAT
===================================================== */

@keyframes heartBeat{

    0%{

        transform:scale(1);

    }

    8%{

        transform:scale(1.035);

    }

    15%{

        transform:scale(1);

    }

    27%{

        transform:scale(1.018);

    }

    38%{

        transform:scale(1);

    }

    100%{

        transform:scale(1);

    }

}


/* =====================================================
   ECG
===================================================== */

.ecg{

    position:absolute;

    width:min(900px,100vw);

    height:100px;

    left:50%;
    top:50%;

    transform:

    translate(-50%,-50%);

    z-index:10;

    pointer-events:none;

    opacity:.68;

}


.ecg svg{

    width:100%;
    height:100%;

    display:block;

}


.ecg path{

    fill:none;

    stroke:#7FA1FF;

    stroke-width:2.3;

    stroke-linecap:round;

    stroke-linejoin:round;

    stroke-dasharray:1000;

    stroke-dashoffset:1000;

    filter:

    drop-shadow(
        0 0 7px
        rgba(127,161,255,.9)
    );

    animation:

    ecgMove
    2.6s
    linear
    infinite;

}


@keyframes ecgMove{

    to{

        stroke-dashoffset:0;

    }

}


/* =====================================================
   SMALL LABEL
===================================================== */

.brand{

    position:absolute;

    bottom:18px;

    left:50%;

    transform:
    translateX(-50%);

    z-index:20;

    color:

    rgba(255,255,255,.28);

    font-size:9px;

    letter-spacing:3px;

    white-space:nowrap;

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:901px){

    .heart-container{

        width:500px;
        height:540px;

    }

    model-viewer{

        width:500px;
        height:540px;

    }

}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:900px){

    .heart-container{

        width:430px;
        height:470px;

    }

    model-viewer{

        width:430px;
        height:470px;

    }

    .orbit{

        width:450px;
        height:450px;

    }

    .glow{

        width:390px;
        height:390px;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    .heart-container{

        width:330px;
        height:390px;

    }

    model-viewer{

        width:330px;
        height:390px;

    }

    .orbit{

        width:350px;
        height:350px;

    }

    .glow{

        width:300px;
        height:300px;

    }

    .ecg{

        width:560px;

        opacity:.55;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

    .heart-container{

        width:290px;
        height:350px;

    }

    model-viewer{

        width:290px;
        height:350px;

    }

    .orbit{

        width:310px;
        height:310px;

    }

    .ecg{

        width:470px;

    }

}

</style>

</head>


<body>


<div class="heart-page">


    <!-- GLOW -->

    <div class="glow"></div>


    <!-- ORBIT -->

    <div class="orbit"></div>


    <!-- ECG -->

    <div class="ecg">

        <svg
        viewBox="0 0 900 120"
        preserveAspectRatio="none">

            <path d="
                M0 60
                L145 60
                L170 60
                L188 54
                L205 60
                L255 60
                L275 60
                L292 18
                L307 101
                L322 60
                L375 60
                L400 60
                L420 42
                L438 60
                L900 60
            "/>

        </svg>

    </div>


    <!-- HEART -->

    <div class="heart-container">


        <model-viewer

        src="./New_Project_8242026.glb"

        alt="Kalam Home Care 3D Heart"

        auto-rotate

        auto-rotate-delay="0"

        rotation-per-second="6deg"

        interaction-prompt="none"

        disable-zoom

        shadow-intensity="1"

        shadow-softness=".8"

        exposure="1.1"

        environment-image="neutral"

        camera-orbit="0deg 90deg 14m"

        camera-target="0m 0m 0m"

        field-of-view="45deg">

        </model-viewer>


    </div>


    <div class="brand">

        KALAM HOME CARE

    </div>


</div>


</body>

</html>
