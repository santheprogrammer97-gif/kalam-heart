<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kalam Home Care</title>

<script
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
type="module">
</script>

<style>

*{
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    overflow:hidden;

}

body{

    background:
    radial-gradient(
        circle at 50% 50%,
        #214AA8 0%,
        #163B88 40%,
        #0D2B68 72%,
        #071D4D 100%
    );

    font-family:Arial,Helvetica,sans-serif;

}


/* =========================
   MAIN
========================= */

.heart-page{

    position:relative;

    width:100vw;
    height:100vh;

    min-height:480px;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

}


/* =========================
   GLOW
========================= */

.glow{

    position:absolute;

    width:440px;
    height:440px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:

    radial-gradient(
        circle,
        rgba(90,135,255,.28),
        rgba(70,110,230,.10) 45%,
        transparent 72%
    );

    filter:blur(35px);

    z-index:1;

    animation:pulseGlow 1.1s ease-in-out infinite;

}

@keyframes pulseGlow{

    0%,100%{
        transform:translate(-50%,-50%) scale(.95);
        opacity:.7;
    }

    10%{
        transform:translate(-50%,-50%) scale(1.08);
        opacity:1;
    }

    20%{
        transform:translate(-50%,-50%) scale(.98);
        opacity:.75;
    }

    35%{
        transform:translate(-50%,-50%) scale(1.04);
        opacity:.9;
    }

}


/* =========================
   ORBIT
========================= */

.orbit{

    position:absolute;

    width:540px;
    height:540px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    border:1px solid rgba(160,190,255,.22);

    z-index:2;

    pointer-events:none;

    animation:rotateOrbit 22s linear infinite;

}

.orbit:before{

    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#91AEFF;

    box-shadow:
    0 0 10px #91AEFF,
    0 0 25px #91AEFF;

    top:5px;
    left:50%;

}

.orbit:after{

    content:"";

    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:white;

    box-shadow:
    0 0 12px white,
    0 0 25px rgba(255,255,255,.7);

    right:18px;
    bottom:65px;

}

@keyframes rotateOrbit{

    from{
        transform:translate(-50%,-50%) rotate(0deg);
    }

    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }

}


/* =========================
   HEART
========================= */

.heart-container{

    position:relative;

    z-index:5;

    width:440px;
    height:520px;

    display:flex;

    align-items:center;
    justify-content:center;

    animation:heartbeat 1.1s ease-in-out infinite;

}


@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    8%{
        transform:scale(1.025);
    }

    15%{
        transform:scale(1);
    }

    27%{
        transform:scale(1.015);
    }

    38%{
        transform:scale(1);
    }

}


model-viewer{

    width:440px;
    height:520px;

    display:block;

    background:transparent;

    --poster-color:transparent;

    border:none;
    outline:none;

    pointer-events:none;

    filter:
    drop-shadow(
        0 18px 28px rgba(0,0,0,.20)
    );

}


/* =========================
   ECG
========================= */

.ecg{

    position:absolute;

    width:min(900px,100vw);

    height:100px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:10;

    pointer-events:none;

    opacity:.65;

}

.ecg svg{

    width:100%;
    height:100%;

}

.ecg path{

    fill:none;

    stroke:#8AA8FF;

    stroke-width:2.4;

    stroke-linecap:round;

    stroke-linejoin:round;

    stroke-dasharray:1000;

    stroke-dashoffset:1000;

    filter:
    drop-shadow(
        0 0 7px rgba(130,165,255,.9)
    );

    animation:ecgAnimation 2.6s linear infinite;

}

@keyframes ecgAnimation{

    to{
        stroke-dashoffset:0;
    }

}


/* =========================
   BRAND
========================= */

.brand{

    position:absolute;

    bottom:16px;

    left:50%;

    transform:translateX(-50%);

    color:rgba(255,255,255,.25);

    font-size:9px;

    font-weight:700;

    letter-spacing:3px;

    z-index:20;

    white-space:nowrap;

}


/* =========================
   LARGE SCREEN
========================= */

@media(min-width:1000px){

    .heart-container{

        width:440px;
        height:520px;

    }

    model-viewer{

        width:440px;
        height:520px;

    }

}


/* =========================
   TABLET
========================= */

@media(max-width:900px){

    .orbit{

        width:470px;
        height:470px;

    }

    .glow{

        width:390px;
        height:390px;

    }

    .heart-container{

        width:390px;
        height:470px;

    }

    model-viewer{

        width:390px;
        height:470px;

    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .orbit{

        width:350px;
        height:350px;

    }

    .glow{

        width:290px;
        height:290px;

    }

    .heart-container{

        width:320px;
        height:400px;

    }

    model-viewer{

        width:320px;
        height:400px;

    }

    .ecg{

        width:600px;

        opacity:.55;

    }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px){

    .heart-container{

        width:285px;
        height:350px;

    }

    model-viewer{

        width:285px;
        height:350px;

    }

    .orbit{

        width:310px;
        height:310px;

    }

    .ecg{

        width:500px;

    }

}

</style>

</head>


<body>

<div class="heart-page">


    <!-- BLUE GLOW -->

    <div class="glow"></div>


    <!-- ORBIT -->

    <div class="orbit"></div>


    <!-- SINGLE ECG -->

    <div class="ecg">

        <svg
        viewBox="0 0 900 120"
        preserveAspectRatio="none">

            <path d="
                M0 60
                L145 60
                L170 60
                L188 54
                L205 60
                L255 60
                L275 60
                L292 18
                L307 101
                L322 60
                L375 60
                L400 60
                L420 42
                L438 60
                L900 60
            "/>

        </svg>

    </div>


    <!-- 3D HEART -->

    <div class="heart-container">

        <model-viewer

            src="./New_Project_8242026.glb"

            alt="Kalam Home Care 3D Heart"

            auto-rotate

            auto-rotate-delay="0"

            rotation-per-second="5deg"

            interaction-prompt="none"

            disable-zoom

            shadow-intensity="0.7"

            shadow-softness="1"

            exposure="0.75"

            environment-image="neutral"

            camera-orbit="0deg 90deg 24m"

            camera-target="0m 0m 0m"

            field-of-view="55deg">

        </model-viewer>

    </div>


    <div class="brand">
        KALAM HOME CARE
    </div>


</div>

</body>

</html>
